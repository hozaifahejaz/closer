<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closer · Deep Questions for Two</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1d1420; --bg2:#2a1c2e; --card:#fbf3ea; --ink:#2b1d2e; --muted:#a893a9; --accent:#e8766f; --accent2:#f3b27a; --line:#3d2b41; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Inter,system-ui,sans-serif; color:#f4e9ef;
    background: radial-gradient(1200px 600px at 50% -10%, #43263f 0%, var(--bg) 60%); display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { font-family:Fraunces,serif; font-weight:600; font-size:28px; margin:8px 0 4px; letter-spacing:.3px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; text-align:center; }
  .panel { width:100%; max-width:420px; background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:22px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  input, select { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#1a111c; color:#fff; font-size:16px; font-family:inherit; }
  input.code { text-transform:uppercase; letter-spacing:6px; text-align:center; font-weight:600; }
  button { font-family:inherit; font-size:15px; font-weight:600; border:0; border-radius:12px; padding:12px 16px; cursor:pointer; }
  .primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#2b1320; width:100%; }
  .ghost { background:transparent; color:#f4e9ef; border:1px solid var(--line); }
  .or { text-align:center; color:var(--muted); font-size:12px; margin:16px 0; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .stack > * + * { margin-top:12px; }
  .hidden { display:none !important; }
  .err { color:#ff9a8f; font-size:13px; min-height:18px; margin-top:8px; }

  .top { width:100%; max-width:460px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .pill { font-size:13px; padding:6px 12px; border-radius:999px; background:var(--bg2); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill b { color:#fff; letter-spacing:2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6b5a6d; margin-right:6px; vertical-align:middle; }
  .dot.on { background:#7fd6a0; box-shadow:0 0 8px #7fd6a0; }

  .scene { width:100%; max-width:460px; aspect-ratio: 3/4; max-height:62vh; perspective:1400px; cursor:pointer; }
  .card { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:36px 30px; text-align:center; box-shadow:0 30px 60px -20px rgba(0,0,0,.6); }
  .back { background:linear-gradient(150deg,#e8766f,#b8527a 55%,#6d3a78); }
  .back .mark { font-family:Fraunces,serif; font-size:44px; color:#fff; opacity:.95; }
  .back .hint { margin-top:10px; font-size:13px; color:#ffe6e6; opacity:.85; }
  .front { background:var(--card); color:var(--ink); transform:rotateY(180deg); }
  .front .cat { position:absolute; top:22px; left:0; right:0; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:#b8527a; font-weight:600; }
  .front .q { font-family:Fraunces,serif; font-size:clamp(22px,5.4vw,28px); line-height:1.3; font-weight:500; }
  .front .num { position:absolute; bottom:20px; font-size:12px; color:#9a8599; }
  .fav { position:absolute; top:14px; right:16px; background:none; border:0; font-size:22px; padding:6px; color:#c9b3c3; }
  .fav.on { color:#e8766f; }

  .controls { width:100%; max-width:460px; display:flex; gap:10px; margin-top:18px; }
  .controls .ghost { flex:0 0 64px; }
  .controls .primary { flex:1; }
  .bar { width:100%; max-width:460px; margin-top:14px; display:flex; gap:10px; }
  .bar select { flex:1; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#000c; padding:10px 16px; border-radius:10px; font-size:14px; transition:opacity .3s; }
</style>
</head>
<body>
  <h1>Closer</h1>
  <p class="sub">Deep questions for two. Same card, same moment, wherever you are.</p>

  <!-- Lobby -->
  <div id="lobby" class="panel stack">
    <div><label for="name">Your name</label><input id="name" maxlength="24" placeholder="e.g. Sam"></div>
    <button class="primary" id="create">Start a new room</button>
    <div class="or">or join your partner</div>
    <div class="row">
      <input id="joinCode" class="code" maxlength="4" placeholder="CODE">
      <button class="ghost" id="join" style="flex:0 0 96px">Join</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <!-- Game -->
  <div id="game" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="top">
      <span class="pill">Room <b id="code"></b></span>
      <span class="pill" id="partners"><span class="dot"></span>Waiting for partner…</span>
    </div>
    <div class="scene" id="scene" title="Tap to flip">
      <div class="card" id="card">
        <div class="face back"><div class="mark">♡</div><div class="hint">Tap to reveal together</div></div>
        <div class="face front">
          <div class="cat" id="cat"></div>
          <button class="fav" id="fav" title="Save to favorites">♥</button>
          <div class="q" id="q"></div>
          <div class="num" id="num"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ghost" id="prev" aria-label="Previous">←</button>
      <button class="primary" id="next">Next question</button>
    </div>
    <div class="bar">
      <select id="category"></select>
      <button class="ghost" id="share">Share code</button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let room = null, es = null, me = '';

try { $('name').value = localStorage.getItem('closer:name') || ''; } catch {}
const params = new URLSearchParams(location.search);
if (params.get('room')) $('joinCode').value = params.get('room').toUpperCase();

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1800); }
function getName() { const n = $('name').value.trim(); if (!n) { $('err').textContent = 'Add your name first.'; return null; } try { localStorage.setItem('closer:name', n); } catch {} return n; }

$('create').onclick = async () => {
  me = getName(); if (!me) return;
  const r = await fetch('/api/rooms', { method: 'POST' }).then(r => r.json());
  connect(r.code);
};
$('join').onclick = () => {
  me = getName(); if (!me) return;
  const code = $('joinCode').value.trim().toUpperCase();
  if (code.length !== 4) { $('err').textContent = 'Room codes are 4 letters.'; return; }
  connect(code);
};

async function connect(code) {
  $('err').textContent = '';
  const check = await fetch(`/api/rooms/${code}`, { method: 'GET' });
  if (check.status === 404) { $('err').textContent = 'No room with that code.'; return; }
  es = new EventSource(`/api/rooms/${code}/events?name=${encodeURIComponent(me)}`);
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { if (!room) { $('err').textContent = 'Could not join (the room may be full).'; es.close(); } };
  history.replaceState(null, '', `?room=${code}`);
}

let lastKey = '';
function render(s) {
  const first = !room; room = s;
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  $('code').textContent = s.code;
  const partner = s.partners.filter(p => p !== me);
  const together = s.partners.length === 2;
  $('partners').innerHTML = `<span class="dot ${together ? 'on' : ''}"></span>` + (together ? `With ${escapeHtml(partner[0] || s.partners[1])}` : 'Waiting for partner…');
  if (first) $('category').innerHTML = s.categories.map(c => `<option>${c}</option>`).join('');
  $('category').value = s.category;
  $('cat').textContent = s.card.category;
  $('num').textContent = `${s.index + 1} / ${s.total}`;
  $('fav').classList.toggle('on', s.favorites.includes(s.card.text));
  const key = s.category + s.index;
  if (key !== lastKey && $('card').classList.contains('flipped') && !s.flipped) {
    // Let the card flip face-down before swapping text, so the next question isn't spoiled.
    $('card').classList.remove('flipped'); setTimeout(() => $('q').textContent = s.card.text, 300);
  } else { $('q').textContent = s.card.text; $('card').classList.toggle('flipped', s.flipped); }
  lastKey = key;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const act = body => fetch(`/api/rooms/${room.code}/action`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
$('scene').onclick = e => { if (e.target.id !== 'fav') act({ type: 'flip' }); };
$('fav').onclick = e => { e.stopPropagation(); act({ type: 'favorite' }); };
$('next').onclick = () => act({ type: 'next' });
$('prev').onclick = () => act({ type: 'prev' });
$('category').onchange = e => act({ type: 'category', category: e.target.value });
$('share').onclick = async () => {
  const link = `${location.origin}/?room=${room.code}`;
  try { if (navigator.share) await navigator.share({ title: 'Join me on Closer', text: `Room code ${room.code}`, url: link }); else { await navigator.clipboard.writeText(link); toast('Invite link copied'); } }
  catch { toast(`Code: ${room.code}`); }
};
</script>
</body>
</html>
